# Override để scale ngang: bỏ port của agent, đặt Nginx làm load balancer ở cổng 8080.
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build --scale agent=3
services:
  agent:
    ports: !reset []

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    restart: unless-stopped
