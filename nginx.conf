events { worker_connections 256; }

http {
    # DNS nội bộ của Docker: "agent" trả về IP của tất cả replica, resolve lại mỗi 5s
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        add_header X-Served-By $upstream_addr always;

        location / {
            # Dùng biến để Nginx resolve lại tên lúc chạy (thấy replica mới/bị mất)
            set $agent_upstream http://agent:8000;
            proxy_pass $agent_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;
        }
    }
}
